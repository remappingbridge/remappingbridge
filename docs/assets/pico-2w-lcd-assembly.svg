<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="assemblytitle assemblydesc">
<title id="assemblytitle">Pico 2 W and Pico-LCD-1.3 mechanical assembly overview</title>
<desc id="assemblydesc">Original conceptual top views of a green Raspberry Pi Pico 2 W with RP2350 processor, wireless module, Micro-USB socket and two rows of 20-pin headers, beside a blue Waveshare Pico-LCD-1.3 with left joystick, square IPS display, A B X Y right buttons and a female two-row Pico connector. Before attachment remove USB power, check all 40 positions and alignment with real manufacturer pin-1 markings. Never force the connector.</desc>
